[ids]
*
#  learn the order if you wanna change it
[main]
# turns extra key on some keyboards to shift
102nd = layer(shift)
# mods & layouts
capslock = overload(vimL, esc)
space = overload(vimR, space)
f = lettermod(Fnum, f, 200, 300)
d = lettermod(shift, d, 200, 300)
k = lettermod(shift, k, 200, 300)
# kdeconnect phone storage (just an idea) G+B = Alt+Shift+B
g = overloadi(g, overloadt2(phone, g, 300), 200)
[phone]
b = A-S-b
# vim layers should come after lettermods
[vimR]
# hold space . right hand
n = backspace
o = enter
h = left
j = down
k = up
l = right
i = home
m = end
u = esc
[ = {
] = }
; = :
' = "
\ = |
/ = ?
. = >
, = <
` = ~
1 = !
2 = @
3 = #
4 = $
5 = %
6 = ^
7 = &
8 = *
9 = (
0 = )
- = _
= = +
[vimL:C]
# hold capslock . left hand
f = layer(SuperCtrl)
x = M-x
c = M-c
v = M-v
leftalt = C-a
q = pageup
e = pagedown
# this ones only to make super + ctrl easy
[SuperCtrl:M-C]
# Fnum layer should be after vim layers
[Fnum:M]
j = M-1
k = M-2
l = M-3
u = M-4
i = M-5
o = M-6
# you can read see the layouts visually on github 
